<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daymark — system data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f4f1e9;
      --color-paper-2: #faf8f2;
      --color-ink:     #16150f;
      --color-muted:   #6b675c;
      --color-soft:    #8b8678;
      --color-rule:    #d9d3c4;
      --color-accent:  #2f6b45;
      --color-link:    #a45a12;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .sub {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · Daymark</p>
    <h1>Facts first, language second</h1>
    <p class="sub">How a morning brief is produced — offline model, deterministic arithmetic, AMD-hosted language, tamper-evident ledger</p>

    <div class="diagram-container">
      <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="daymark-flow-title daymark-flow-desc">
        <title id="daymark-flow-title">Daymark system data flow</title>
        <desc id="daymark-flow-desc">Public grocery data feeds an offline forecasting engine whose artifacts drive the Rust decision API; the API calls Gemma served by vLLM on AMD Instinct for language only, verifies every figure, publishes the brief, and signs manager decisions into a hash-chained ledger.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b675c"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f6b45"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a45a12"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f4f1e9"/>

        <!-- ============ arrows first (behind nodes) ============ -->
        <!-- N1 -> N2 -->
        <line x1="148" y1="176" x2="148" y2="212" stroke="#6b675c" stroke-width="1.5" marker-end="url(#arrow)"/>
        <!-- N2 -> N3 -->
        <line x1="148" y1="316" x2="148" y2="352" stroke="#6b675c" stroke-width="1.5" marker-end="url(#arrow)"/>
        <!-- N3 -> N4 (right, then up) -->
        <path d="M 248 392 L 468 392 L 468 288" fill="none" stroke="#6b675c" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="268" y="380" width="128" height="16" fill="#f4f1e9"/>
        <text x="332" y="391" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#8b8678" text-anchor="middle">ARTIFACTS&#160;·&#160;PARQUET</text>
        <!-- N4 -> N6 (link, outbound) -->
        <path d="M 600 176 L 652 176 L 652 144 L 700 144" fill="none" stroke="#a45a12" stroke-width="1.5" marker-end="url(#arrow-link)"/>
        <rect x="606" y="120" width="92" height="16" fill="#f4f1e9"/>
        <text x="652" y="131" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#8b8678" text-anchor="middle">PROMPT&#160;+&#160;FACTS</text>
        <!-- N6 -> N4 (link, return) -->
        <path d="M 700 172 L 664 172 L 664 200 L 600 200" fill="none" stroke="#a45a12" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
        <rect x="606" y="188" width="66" height="16" fill="#f4f1e9"/>
        <text x="639" y="199" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#8b8678" text-anchor="middle">COPY</text>
        <!-- N4 -> N7 -->
        <path d="M 600 248 L 676 248 L 676 292 L 700 292" fill="none" stroke="#6b675c" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="616" y="236" width="76" height="16" fill="#f4f1e9"/>
        <text x="654" y="247" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#8b8678" text-anchor="middle">PUBLISHED</text>
        <!-- N7 -> N8 -->
        <line x1="804" y1="344" x2="804" y2="384" stroke="#6b675c" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="748" y="356" width="112" height="16" fill="#f4f1e9"/>
        <text x="804" y="367" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.06em" fill="#8b8678" text-anchor="middle">APPROVE&#160;·&#160;EDIT</text>

        <!-- ============ nodes ============ -->
        <!-- N1 public data (input) -->
        <rect x="48" y="96" width="200" height="80" rx="6" fill="#faf8f2" stroke="#b8b1a0" stroke-width="1.5"/>
        <rect x="48" y="96" width="200" height="16" rx="2" fill="#ece7da"/>
        <text x="60" y="108" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#6b675c">PUBLIC DATA</text>
        <text x="64" y="136" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#16150f">Corporación Favorita</text>
        <text x="64" y="154" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678">3 stores · 242 fresh SKUs · 2013–2017</text>

        <!-- N2 engine (step) -->
        <rect x="48" y="212" width="200" height="104" rx="6" fill="#faf8f2" stroke="#6b675c" stroke-width="1.5"/>
        <rect x="48" y="212" width="200" height="16" rx="2" fill="#ece7da"/>
        <text x="60" y="224" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#6b675c">OFFLINE ENGINE · PYTHON</text>
        <text x="64" y="252" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#16150f">Demand forecaster</text>
        <text x="64" y="270" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678">LightGBM quantiles p10 · p50 · p90</text>
        <text x="64" y="286" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678">backtest · WAPE 26.7% · skill +27%</text>
        <text x="64" y="302" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678">measured promo lift</text>

        <!-- N3 artifacts (store) -->
        <rect x="48" y="352" width="200" height="80" rx="6" fill="#faf8f2" stroke="#8b8678" stroke-width="1.5"/>
        <rect x="48" y="352" width="200" height="16" rx="2" fill="#ece7da"/>
        <text x="60" y="364" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#6b675c">ARTIFACTS</text>
        <text x="64" y="392" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#16150f">Forecasts · metrics · why-chips</text>
        <text x="64" y="410" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678">committed parquet · reproducible</text>

        <!-- N4 core (step, focal) -->
        <rect x="352" y="136" width="248" height="176" rx="6" fill="#eef2ec" stroke="#2f6b45" stroke-width="1.5"/>
        <rect x="352" y="136" width="248" height="16" rx="2" fill="#dbe7d8"/>
        <text x="364" y="148" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#2f6b45">DECISION CORE · RUST</text>
        <text x="368" y="176" font-family="'Geist', sans-serif" font-size="12.5" font-weight="600" fill="#16150f">Daymark API (Axum)</text>
        <text x="368" y="196" font-family="'Geist Mono', monospace" font-size="9" fill="#6b675c">policies — newsvendor orders, marks</text>
        <text x="368" y="212" font-family="'Geist Mono', monospace" font-size="9" fill="#6b675c">simulator — deterministic replay</text>
        <text x="368" y="228" font-family="'Geist Mono', monospace" font-size="9" fill="#6b675c">grounding — every figure verified</text>
        <text x="368" y="244" font-family="'Geist Mono', monospace" font-size="9" fill="#6b675c">ledger — SHA-256 hash chain</text>
        <text x="368" y="272" font-family="'Geist Mono', monospace" font-size="9" fill="#2f6b45">the model decides · the LLM explains</text>
        <text x="368" y="290" font-family="'Geist Mono', monospace" font-size="9" fill="#2f6b45">the ledger proves</text>

        <!-- N6 AMD vLLM (external, focal) -->
        <rect x="700" y="96" width="208" height="96" rx="6" fill="#eef2ec" stroke="#2f6b45" stroke-width="1.5"/>
        <rect x="700" y="96" width="208" height="16" rx="2" fill="#dbe7d8"/>
        <text x="712" y="108" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#2f6b45">AMD DEVELOPER CLOUD</text>
        <text x="716" y="136" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#16150f">vLLM + Gemma · ROCm</text>
        <text x="716" y="154" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678">AMD Instinct GPU · OpenAI API</text>
        <text x="716" y="170" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678">measured tok/s → $ per brief</text>

        <!-- N7 brief (output) -->
        <rect x="700" y="268" width="208" height="76" rx="6" fill="#faf8f2" stroke="#6b675c" stroke-width="1.5"/>
        <rect x="700" y="268" width="208" height="16" rx="2" fill="#ece7da"/>
        <text x="712" y="280" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#6b675c">OUTPUT</text>
        <text x="716" y="306" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#16150f">The morning edition</text>
        <text x="716" y="324" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678">orders · markdowns · promos · watchlist</text>

        <!-- N8 ledger (store) -->
        <rect x="700" y="384" width="208" height="72" rx="6" fill="#faf8f2" stroke="#8b8678" stroke-width="1.5"/>
        <rect x="700" y="384" width="208" height="16" rx="2" fill="#ece7da"/>
        <text x="712" y="396" font-family="'Geist Mono', monospace" font-size="7.5" font-weight="500" letter-spacing="0.18em" fill="#6b675c">AUDIT</text>
        <text x="716" y="422" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#16150f">Signed decisions</text>
        <text x="716" y="440" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678">tamper-evident · re-verified on read</text>

        <!-- ============ legend ============ -->
        <line x1="48" y1="524" x2="912" y2="524" stroke="#d9d3c4" stroke-width="1"/>
        <rect x="48" y="548" width="12" height="12" rx="2" fill="#faf8f2" stroke="#b8b1a0"/>
        <text x="68" y="558" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.04em" fill="#6b675c">INPUT</text>
        <rect x="128" y="548" width="12" height="12" rx="2" fill="#faf8f2" stroke="#6b675c"/>
        <text x="148" y="558" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.04em" fill="#6b675c">STEP / OUTPUT</text>
        <rect x="268" y="548" width="12" height="12" rx="2" fill="#faf8f2" stroke="#8b8678"/>
        <text x="288" y="558" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.04em" fill="#6b675c">STORE</text>
        <rect x="348" y="548" width="12" height="12" rx="2" fill="#eef2ec" stroke="#2f6b45"/>
        <text x="368" y="558" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.04em" fill="#6b675c">FOCAL</text>
        <line x1="436" y1="554" x2="468" y2="554" stroke="#a45a12" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="476" y="558" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.04em" fill="#6b675c">HTTP TO MODEL / RETURN</text>
      </svg>
    </div>
  </div>
</body>
</html>
