<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="waste-waterfall-title waste-waterfall-desc" id="replay-waterfall-root">
        <title id="waste-waterfall-title">Waste units fall from 5684 to 2374 across two policy changes</title>
        <desc id="waste-waterfall-desc">A waterfall showing 5684 waste units under the spreadsheet policy, minus 2553 from quantile demand forecasts, minus 757 from the markdown engine, ending at 2374 units — a 58% reduction under identical demand.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #replay-waterfall-root { --color-paper:   #f4f1e9;
      --color-paper-2: #faf8f2;
      --color-ink:     #16150f;
      --color-muted:   #6b675c;
      --color-soft:    #8b8678;
      --color-rule:    #d9d3c4;
      --color-accent:  #2f6b45;
      --color-ochre:   #a45a12;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #replay-waterfall-root { font-family: var(--font-sans); color: var(--color-ink); }
      #replay-waterfall-root .diagram-container { width: 100%; overflow-x: auto; }
      #replay-waterfall-root .sub { font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem; }
      #replay-waterfall-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="replay-waterfall-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#2f6b45" stroke-width="1" opacity="0.35"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f4f1e9"/>

        <!-- ============ gridlines + y axis ============ -->
        <line x1="160" y1="480" x2="920" y2="480" stroke="#16150f" stroke-width="1"/>
        <line x1="160" y1="339" x2="920" y2="339" stroke="#d9d3c4" stroke-width="1"/>
        <line x1="160" y1="198" x2="920" y2="198" stroke="#d9d3c4" stroke-width="1"/>
        <line x1="160" y1="57" x2="920" y2="57" stroke="#d9d3c4" stroke-width="1"/>
        <text x="148" y="484" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678" text-anchor="end">0</text>
        <text x="148" y="343" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678" text-anchor="end">2,000</text>
        <text x="148" y="202" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678" text-anchor="end">4,000</text>
        <text x="148" y="61" font-family="'Geist Mono', monospace" font-size="9" fill="#8b8678" text-anchor="end">6,000</text>

        <!-- ============ connectors (behind bars) ============ -->
        <line x1="320" y1="79" x2="520" y2="79" stroke="#6b675c" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="520" y1="259" x2="680" y2="259" stroke="#6b675c" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="680" y1="313" x2="840" y2="313" stroke="#6b675c" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- ============ bars ============ -->
        <!-- start: spreadsheet -->
        <rect x="200" y="79" width="120" height="401" rx="2" fill="#ece7da" stroke="#6b675c" stroke-width="1.5"/>
        <text x="260" y="64" font-family="'Geist Mono', monospace" font-size="13" font-weight="600" fill="#16150f" text-anchor="middle">5,684</text>
        <text x="260" y="502" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#16150f" text-anchor="middle">Spreadsheet</text>
        <text x="260" y="518" font-family="'Geist Mono', monospace" font-size="8.5" letter-spacing="0.04em" fill="#8b8678" text-anchor="middle">LAST WEEKDAY × 1.05</text>

        <!-- delta 1: forecasts -->
        <rect x="420" y="79" width="120" height="180" rx="2" fill="url(#replay-waterfall-hatch)" stroke="#2f6b45" stroke-width="1.5"/>
        <text x="480" y="64" font-family="'Geist Mono', monospace" font-size="13" font-weight="600" fill="#2f6b45" text-anchor="middle">−2,553</text>
        <text x="480" y="278" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#16150f" text-anchor="middle">Quantile forecasts</text>
        <text x="480" y="294" font-family="'Geist Mono', monospace" font-size="8.5" letter-spacing="0.04em" fill="#8b8678" text-anchor="middle">REPLACE THE ORDER RULE</text>

        <!-- delta 2: markdown engine -->
        <rect x="580" y="259" width="120" height="54" rx="2" fill="url(#replay-waterfall-hatch)" stroke="#a45a12" stroke-width="1.5"/>
        <text x="640" y="248" font-family="'Geist Mono', monospace" font-size="13" font-weight="600" fill="#a45a12" text-anchor="middle">−757</text>
        <text x="640" y="334" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#16150f" text-anchor="middle">Markdown engine</text>
        <text x="640" y="350" font-family="'Geist Mono', monospace" font-size="8.5" letter-spacing="0.04em" fill="#8b8678" text-anchor="middle">CLEARS EXPIRING LOTS</text>

        <!-- end: daymark -->
        <rect x="740" y="313" width="120" height="167" rx="2" fill="#2f6b45" stroke="#2f6b45" stroke-width="1.5"/>
        <text x="800" y="302" font-family="'Geist Mono', monospace" font-size="13" font-weight="600" fill="#16150f" text-anchor="middle">2,374</text>
        <text x="800" y="502" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#16150f" text-anchor="middle">Daymark policy</text>
        <text x="800" y="518" font-family="'Geist Mono', monospace" font-size="8.5" letter-spacing="0.04em" fill="#8b8678" text-anchor="middle">−58% WASTE</text>

        <!-- ============ annotations (2 max) ============ -->
        <text x="480" y="382" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="14" fill="#6b675c" text-anchor="middle">Demand is forecast from the store&#8217;s own history — weekday, holidays, paydays, promo calendar</text>
        <text x="672" y="414" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="14" fill="#6b675c" text-anchor="middle">The trade-off: 0.6 service points and 1.3k more lost sales</text>

        <!-- ============ legend ============ -->
        <line x1="48" y1="556" x2="920" y2="556" stroke="#d9d3c4" stroke-width="1"/>
        <rect x="48" y="578" width="12" height="12" rx="2" fill="#ece7da" stroke="#6b675c"/>
        <text x="68" y="588" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.04em" fill="#6b675c">START / END POLICIES</text>
        <rect x="232" y="578" width="12" height="12" rx="2" fill="url(#replay-waterfall-hatch)" stroke="#2f6b45"/>
        <text x="252" y="588" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.04em" fill="#6b675c">WASTE AVOIDED BY CHANGE</text>
        <text x="48" y="616" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.04em" fill="#8b8678">REPRODUCE: curl "localhost:8787/api/replay?store=2" · SIMULATED DEMAND = RECORDED SALES · SHELF LIFE AND PRICES ARE DECLARED ASSUMPTIONS</text>
      </svg>
